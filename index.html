<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>學習樂園</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=ZCOOL+KuaiLe&display=swap');

  :root{
    --sky-top:#7FD1FF;
    --sky-bottom:#BDEBFF;
    --sun:#FFD93D;
    --coral:#FF6F59;
    --grass:#6FCF6F;
    --purple:#8C6BC8;
    --white:#FFFFFF;
    --ink:#2B2250;
    --card-shadow: 0 8px 0 rgba(43,34,80,0.18);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0; padding:0; min-height:100%;
    font-family:'ZCOOL KuaiLe', sans-serif;
    color:var(--ink);
    overflow-x:hidden;
  }

  body{
    background:linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 55%, #FFF6DD 100%);
    min-height:100vh;
    position:relative;
  }

  .deco{ position:fixed; pointer-events:none; z-index:0; opacity:0.9; }
  .sun{ top:18px; right:22px; width:70px; height:70px; border-radius:50%;
    background:var(--sun); box-shadow:0 0 0 10px rgba(255,217,61,0.35); }
  .cloud{ background:#fff; border-radius:50px; opacity:0.85; }
  .cloud1{ top:60px; left:-20px; width:140px; height:44px; }
  .cloud1::before, .cloud1::after{ content:''; position:absolute; background:#fff; border-radius:50%; }
  .cloud1::before{ width:60px; height:60px; top:-28px; left:14px; }
  .cloud1::after{ width:44px; height:44px; top:-20px; left:70px; }
  .cloud2{ top:150px; right:-30px; width:110px; height:36px; }
  .cloud2::before{ content:''; position:absolute; width:46px; height:46px; background:#fff; border-radius:50%; top:-20px; left:20px; }

  .wrap{ position:relative; z-index:1; max-width:860px; margin:0 auto; padding:26px 18px 50px; }

  header{ text-align:center; margin-bottom:8px; }
  .mascot{ font-size:64px; line-height:1; animation:bob 2.6s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{ transform:translateY(0) rotate(-4deg);} 50%{ transform:translateY(-8px) rotate(4deg);} }

  h1{
    font-size:32px; margin:6px 0 4px;
    text-shadow:2px 2px 0 var(--sun);
    letter-spacing:1px;
  }
  .subtitle{ font-size:16px; color:#5b4f88; margin-bottom:30px; }

  .grid{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
    gap:20px;
  }

  .game-card{
    display:block; text-decoration:none; color:var(--ink);
    background:var(--white); border-radius:22px; padding:22px 18px;
    box-shadow:var(--card-shadow); text-align:center;
    transition:transform .15s ease, box-shadow .15s ease;
    position:relative; overflow:hidden;
  }
  .game-card:active{ transform:translateY(6px); box-shadow:0 2px 0 rgba(43,34,80,0.18); }

  .game-card .icon{ font-size:50px; display:block; margin-bottom:10px; }
  .game-card .name{ font-size:22px; margin-bottom:6px; }
  .game-card .desc{ font-size:14px; color:#7a6fa0; line-height:1.5; }
  .game-card .tag{
    display:inline-block; margin-top:12px; font-size:13px;
    background:var(--sun); color:var(--ink); padding:4px 14px; border-radius:999px;
  }

  .game-card.soon{ opacity:0.55; pointer-events:none; }
  .game-card.soon .tag{ background:#e2e2e2; color:#8a8a8a; }

  footer{ text-align:center; margin-top:40px; font-size:14px; color:#7a6fa0; }
</style>
</head>
<body>

<div class="deco sun"></div>
<div class="deco cloud cloud1"></div>
<div class="deco cloud cloud2"></div>

<div class="wrap">
  <header>
    <div class="mascot">🐻</div>
    <h1>學習樂園</h1>
    <div class="subtitle">給小小朋友的中文語音學習遊戲，點一張卡片開始玩吧！</div>
  </header>

  <div class="grid">

    <a class="game-card" href="games/數字樂園/index.html">
      <span class="icon">🔢</span>
      <div class="name">阿拉伯數字樂園</div>
      <div class="desc">認識 0-10 的數字，聽發音、數一數，還有配對小遊戲</div>
      <span class="tag">適合 3-4 歲</span>
    </a>

    <a class="game-card" href="games/注音練習/index.html">
      <span class="icon">🔤</span>
      <div class="name">注音符號練習</div>
      <div class="desc">認識 37 個注音符號，聽發音、看圖找注音</div>
      <span class="tag">適合 4-6 歲</span>
    </a>

    <a class="game-card" href="games/顏色與形狀/index.html">
      <span class="icon">🎨</span>
      <div class="name">認識顏色與形狀</div>
      <div class="desc">認識 10 種顏色與 8 種形狀，聽發音、找找看</div>
      <span class="tag">適合 3-5 歲</span>
    </a>

  </div>

  <footer>持續增加新遊戲中 🌱</footer>
</div>

</body>
</html>
